<!DOCTYPE html>
<!-- templates -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
</head>

<body>
  <style>
    #swRoot {
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="swRoot"></div>
  <script src="https://oss.dreambigcareer.com/web/SW/flexible-classroom/test/edu_sdk.bundle.js"></script>
  <script src="https://oss.dreambigcareer.com/web/SW/flexible-classroom/test/edu_widget.bundle.js"></script>

  <script type="text/javascript">
    var isFlutterInAppWebViewReady = false;
    window.addEventListener("flutterInAppWebViewPlatformReady", function(event) {
        isFlutterInAppWebViewReady = true;
    });
    function useParams(location) {
      const searchString = location.href.split('?').pop();
      const urlParams = new URLSearchParams(location.href.split('?').pop());
      const audienceParams = {};
      for (let key of urlParams.keys()) {
        audienceParams[key] = urlParams.get(key);
      }
      console.log('urlParams ', audienceParams);
      return audienceParams;
    }
    const {
      userUuid,
      userName,
      roomUuid,
      roleType,
      roomType,
      roomName,
      pretest,
      rtmUid,
      rtmToken,
      language,
      startTime,
      duration=60 * 30,
      recordUrl="https://oss.dreambigcareer.com/record_page_prod.html",
      appId ='21d015747d8543f5bc70f182d82eeb94',
      userRole,
      translateLanguage,
      region,
      minFPS = 1,
      maxFPS = 5,
      resolution = 0.8,
    } = useParams(window.location);
    AgoraEduSDK.config({
      appId,
      region: region ? region : 'AP',
    });
    const unmount = AgoraEduSDK.launch(document.querySelector('#swRoot'), {
      userUuid,
      userName,
      roomUuid,
      roleType: 2,
      roomType: 2,
      roomName,
      pretest: false,
      rtmToken,
      language:'zh',
      startTime,
      duration,
      recordUrl,
      appId,
      uiMode: "dark",
      courseWareList: [],
      platform:'H5',
      widgets: {
          easemobIM: AgoraHXChatWidget, // IM widget
          mediaPlayer: FcrStreamMediaPlayerWidget, // 视频同步播放器widget
          poll: AgoraPolling, // 投票器widget
          watermark: FcrWatermarkWidget, // 水印widget
          webView: FcrWebviewWidget, // 内嵌浏览器widget
          netlessBoard: FcrBoardWidget, // 互动白板widget
          im:AgoraHXChatWidget
      },
      listener: (evt, args) => {
        // do something when classroom is connected
        if (evt === 202 && args=== 3){//关闭灵动课堂 
          if (isFlutterInAppWebViewReady) {
            window.flutter_inappwebview.callHandler('endRoom');
          }
        }
        else if (evt === 1) {
          if (isFlutterInAppWebViewReady) {
            window.flutter_inappwebview.callHandler('enterRoom');
          }
        } else if (evt === 3) {
          if (isFlutterInAppWebViewReady) {
            window.flutter_inappwebview.callHandler('enterFail');
          }
        }else if (evt === 2){//关闭灵动课堂 
          if (isFlutterInAppWebViewReady) {
            window.flutter_inappwebview.callHandler('closeRoom');
            unmount()
          }
        }
       
      },
    });

    window.addEventListener("exitRoom", (event) => {
       unmount()
    }, false);
    
  </script>

</body>

</html>
